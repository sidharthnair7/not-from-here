spring.application.name=not-from-here

# Local file database for verified sightings (H2, no server to run)
spring.datasource.url=jdbc:h2:file:./data/sightings;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Local secrets, one KEY=VALUE per line, never committed (.env is git-ignored)
spring.config.import=optional:file:.env[.properties]

# Which proposer runs: ollama (default, local vision model, the whole catalogue) or plantnet (hosted, plants only)
nfh.llm.provider=${LLM_PROVIDER:ollama}
nfh.ollama.url=${OLLAMA_URL:http://localhost:11434}
nfh.ollama.model=${OLLAMA_MODEL:qwen3.5:9b}
nfh.plantnet.url=${PLANTNET_URL:https://my-api.plantnet.org}
nfh.plantnet.key=${PLANTNET_API_KEY:}
nfh.plantnet.project=${PLANTNET_PROJECT:all}

# Default photo location when EXIF has no GPS: downtown Peterborough
nfh.default.lat=44.30
nfh.default.lng=-78.32

# Disk cache for iNaturalist and GBIF responses so the demo works offline
nfh.cache.dir=./cache
